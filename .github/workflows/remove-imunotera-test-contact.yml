name: Remove ImunoTera test contact
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  remove:
    runs-on: [self-hosted, windows, companiesportfolio]
    steps:
      - name: Remove the identified test request only
        shell: powershell
        run: |
          $env:ENV_FILE = 'C:\Secrets\companiesportfolio\test.env'
          & 'C:\Lumi\runtime\node-v22.14.0-win-x64\node.exe' 'C:\Services\CompaniesPortfolioApi\app\server\db\remove-imunotera-test-contact.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
