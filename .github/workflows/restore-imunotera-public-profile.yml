name: Restore ImunoTera public profile
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: [self-hosted, windows, companiesportfolio]
    steps:
      - name: Restore original published ImunoTera profile
        shell: powershell
        run: |
          $env:ENV_FILE = 'C:\Secrets\companiesportfolio\test.env'
          & 'C:\Lumi\runtime\node-v22.14.0-win-x64\node.exe' 'C:\Services\CompaniesPortfolioApi\app\server\db\restore-imunotera-public-profile.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
