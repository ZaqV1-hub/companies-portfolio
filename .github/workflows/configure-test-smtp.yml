name: Configure test SMTP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  configure:
    runs-on: [self-hosted, windows, companiesportfolio]
    environment: production
    timeout-minutes: 10
    steps:
      - name: Configure Gmail SMTP in the protected API environment
        shell: powershell
        env:
          SMTP_APP_PASSWORD: ${{ secrets.COMPANIES_SMTP_APP_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:SMTP_APP_PASSWORD) { throw 'SMTP app password secret is missing.' }
          $path = 'C:\Secrets\companiesportfolio\test.env'
          if (-not (Test-Path -LiteralPath $path)) { throw 'Protected API environment file is missing.' }
          $client = New-Object System.Net.Mail.SmtpClient('smtp.gmail.com', 587)
          $client.EnableSsl = $true
          $client.Credentials = New-Object System.Net.NetworkCredential('rincaoisaque@gmail.com', $env:SMTP_APP_PASSWORD)
          try {
            $client.Send('rincaoisaque@gmail.com', 'rincaoisaque@gmail.com', 'Teste de e-mail do Companies Portfolio', 'O envio de e-mails de confirmação e recuperação de senha foi configurado.')
          } finally { $client.Dispose() }
          $settings = [ordered]@{
            SMTP_HOST = 'smtp.gmail.com'
            SMTP_PORT = '587'
            SMTP_FROM = 'rincaoisaque@gmail.com'
            SMTP_USER = 'rincaoisaque@gmail.com'
            SMTP_PASSWORD = $env:SMTP_APP_PASSWORD
          }
          $keys = @($settings.Keys)
          $original = [System.IO.File]::ReadAllText($path)
          $lines = @($original -split "`r?`n" | Where-Object {
            $key = ($_ -split '=', 2)[0].Trim()
            $key -notin $keys
          })
          foreach ($key in $keys) { $lines += "$key=$($settings[$key])" }
          $temp = "$path.smtp-tmp"
          [System.IO.File]::WriteAllLines($temp, [string[]]$lines, [System.Text.UTF8Encoding]::new($false))
          Move-Item -LiteralPath $temp -Destination $path -Force
          try {
            Restart-Service -Name 'CompaniesPortfolioApi'
            $healthy = $false
            for ($attempt = 0; $attempt -lt 20; $attempt++) {
              try {
                $response = Invoke-WebRequest -Uri 'http://127.0.0.1:4317/api/health' -UseBasicParsing -TimeoutSec 5
                if ($response.StatusCode -eq 200) { $healthy = $true; break }
              } catch { Start-Sleep -Seconds 2 }
            }
            if (-not $healthy) { throw 'API did not become healthy after SMTP configuration.' }
          } catch {
            [System.IO.File]::WriteAllText($temp, $original, [System.Text.UTF8Encoding]::new($false))
            Move-Item -LiteralPath $temp -Destination $path -Force
            Restart-Service -Name 'CompaniesPortfolioApi'
            throw
          }
          Write-Output 'SMTP configured; API healthy; test email submitted successfully.'
