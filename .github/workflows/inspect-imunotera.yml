name: Inspect ImunoTera test records
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: [self-hosted, windows, companiesportfolio]
    steps:
      - name: Inspect only this site's test database
        shell: powershell
        run: |
          $env:ENV_FILE = 'C:\Secrets\companiesportfolio\test.env'
          & 'C:\Lumi\runtime\node-v22.14.0-win-x64\node.exe' 'C:\Services\CompaniesPortfolioApi\app\server\db\inspect-imunotera.js'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
